spring:
  application:
    name: book-management-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/book_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: 8080